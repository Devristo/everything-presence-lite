esphome:
  name: "hoolty-booth-sensor"
  friendly_name: "Hoolty Booth Sensor"
  name_add_mac_suffix: True
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM -std=gnu++17"
    build_unflags: "-std=gnu++11"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: WARN
  hardware_uart: 'UART0'

# Enable Home Assistant API
api:

ota:
  - platform: esphome
    id: ota_esphome

captive_portal:

wifi:
  ssid: Ristorante
  password: Pizzamargherita276

  ap:
      ssid: "Hoolty Booth Sensor"
      password: "hooltybooth"

web_server:
  port: 80

light:
  - platform: status_led
    name: ESP32 LED
    pin: GPIO2
    internal: False
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

external_components:
  # use all components from a local folder
  - source:
      type: local
      path: ./common/components
    refresh: '0s'
  - source:
      type: git
      url: https://github.com/MichaKersloot/esphome_custom_components
    components: [ esp32_camera ]

