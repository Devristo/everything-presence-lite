uart:
  id: uart_2
  tx_pin: GPIO47
  rx_pin: GPIO21
  baud_rate: 9600
#  port: '/dev/ttyUSB0'
  parity: EVEN
  stop_bits: 1
  data_bits: 8

mqtt:
  id: mqtt_client
  enable_on_boot: true
  broker: "192.168.178.2"
  username: "homeassistant"
  password: "FUxBFa62fkbCTopkyCJTT@!ZAEK8D3u3"

ld6001:
  id: ld6001_radar
  throttle: 1000ms
  uart_id: uart_2
  update_interval: 200ms

sensor:
  - platform: ld6001
    ld6001_id: ld6001_radar
    target_count:
      name: Presence Target Count
    target_1:
      x:
        name: Target-1 X
      y:
        name: Target-1 Y
      pitch_angle:
        name: Target-1 Pitch Angle
      horizontal_angle:
        name: Target-1 Horizontal Angle
      distance:
        name: Target-1 Distance
    target_2:
      x:
        name: Target-2 X
      y:
        name: Target-2 Y
      pitch_angle:
        name: Target-2 Pitch Angle
      horizontal_angle:
        name: Target-2 Horizontal Angle
      distance:
        name: Target-2 Distance

text_sensor:
  - platform: ld6001
    ld6001_id: ld6001_radar
    version:
      name: Version