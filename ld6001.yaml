uart:
  id: uart_2
  tx_pin: GPIO2
  rx_pin: GPIO1
  baud_rate: 9600
#  port: '/dev/ttyUSB0'
  parity: EVEN
  stop_bits: 1
  data_bits: 8

mqtt:
  id: mqtt_client
  enable_on_boot: true
  broker: "192.168.178.2"
  username: "homeassistant"
  password: "FUxBFa62fkbCTopkyCJTT@!ZAEK8D3u3"
  log_topic: null
  # idf_send_async: true

ld6001:
  id: ld6001_radar
  throttle: 1000ms
  uart_id: uart_2
  update_interval: 500ms

sensor:
  - platform: ld6001
    ld6001_id: ld6001_radar
    target_count:
      name: Presence Target Count
    target_1:
      x:
        name: Target-1 X
      y:
        name: Target-1 Y
      pitch_angle:
        name: Target-1 Pitch Angle
      horizontal_angle:
        name: Target-1 Horizontal Angle
      distance:
        name: Target-1 Distance
    target_2:
      x:
        name: Target-2 X
      y:
        name: Target-2 Y
      pitch_angle:
        name: Target-2 Pitch Angle
      horizontal_angle:
        name: Target-2 Horizontal Angle
      distance:
        name: Target-2 Distance
    zone_1:
      target_count:
        name: Zone-1 Target Count
    zone_2:
      target_count:
        name: Zone-2 Target Count
    zone_3:
      target_count:
        name: Zone-3 Target Count
    zone_4:
      target_count:
        name: Zone-4 Target Count

text_sensor:
  - platform: ld6001
    ld6001_id: ld6001_radar
    version:
      name: Version

number:
  - platform: ld6001
    ld6001_id: ld6001_radar
    zone_1:
      x1:
        name: Zone-1 X1
      y1:
        name: Zone-1 Y1
      x2:
        name: Zone-1 X2
      y2:
        name: Zone-1 Y2
    zone_2:
      x1:
        name: Zone-2 X1
      y1:
        name: Zone-2 Y1
      x2:
        name: Zone-2 X2
      y2:
        name: Zone-2 Y2
    zone_3:
      x1:
        name: Zone-3 X1
      y1:
        name: Zone-3 Y1
      x2:
        name: Zone-3 X2
      y2:
        name: Zone-3 Y2
    zone_4:
      x1:
        name: Zone-4 X1
      y1:
        name: Zone-4 Y1
      x2:
        name: Zone-4 X2
      y2:
        name: Zone-4 Y2