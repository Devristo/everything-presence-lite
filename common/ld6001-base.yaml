esphome:
  includes:
    - ./common/libs/zone-detection.h

  on_boot:
    priority: -100
    then:
      # Reset target active
      - binary_sensor.template.publish:
          id: target1_active
          state: false
      - binary_sensor.template.publish:
          id: target2_active
          state: false
      - binary_sensor.template.publish:
          id: target3_active
          state: false
      - binary_sensor.template.publish:
          id: target4_active
          state: false
      - binary_sensor.template.publish:
          id: target5_active
          state: false
      - binary_sensor.template.publish:
          id: target6_active
          state: false
      - binary_sensor.template.publish:
          id: target7_active
          state: false
      - binary_sensor.template.publish:
          id: target8_active
          state: false
      - binary_sensor.template.publish:
          id: target9_active
          state: false
      - binary_sensor.template.publish:
          id: target10_active
          state: false

      # Reset zone occupancy
      - binary_sensor.template.publish:
          id: zone1_occupancy
          state: false
      - binary_sensor.template.publish:
          id: zone2_occupancy
          state: false
      - binary_sensor.template.publish:
          id: zone3_occupancy
          state: false
      - binary_sensor.template.publish:
          id: zone4_occupancy
          state: false
      - delay: 10s # Wait for the sensor to boot (it claims 3s but...)
      # Read version from LD6001
      - uart.write:
          id: uart_2
          data: [0x44, 0x11, 0x00, 0x00, 0x55, 0x4B]

external_components:
  - source:
      type: git
      url: https://github.com/MichaKersloot/esphome_custom_components
    components: [ esp32_camera ]

esp32_camera:
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_pins:
    sda: GPIO4
    scl: GPIO5
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  # Image settings
  name: My Camera

globals:
  - id: mmwave_update_time
    type: unsigned long
    restore_value: False
    initial_value: '0'

interval:
  # Read target data from LD6001
  - interval: 500ms
    startup_delay: 10s
    then:
      - uart.write:
          id: uart_2
          data: [0x44, 0x62, 0x08, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xBE, 0x4B] # Slower but less likely to have false positives
#          data: [0x44, 0x62, 0x08, 0x00, 0x20, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xCE, 0x4B] # Faster but more likely to have false positives

text_sensor:
  - platform: template
    disabled_by_default: True
    name: "mmWave Firmware"
    id: "firmware_version"

binary_sensor:
  - platform: template
    name: "Occupancy"
    device_class: occupancy
    id: occupancy
    filters:
      - delayed_off: !lambda return (id(off_delay).state * 1000);

  # Zone Occupancy
  - platform: template
    name: "Zone 1 Occupancy"
    device_class: occupancy
    id: zone1_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_1_off_delay).state * 1000);
  - platform: template
    name: "Zone 2 Occupancy"
    device_class: occupancy
    id: zone2_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_2_off_delay).state * 1000);
    disabled_by_default: true
  - platform: template
    name: "Zone 3 Occupancy"
    device_class: occupancy
    id: zone3_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_3_off_delay).state * 1000);
    disabled_by_default: true
  - platform: template
    name: "Zone 4 Occupancy"
    device_class: occupancy
    id: zone4_occupancy
    filters:
      - delayed_off: !lambda return (id(zone_4_off_delay).state * 1000);
    disabled_by_default: true

  # Target Active
  - platform: template
    name: "Target 1 Active"
    id: target1_active
  - platform: template
    name: "Target 2 Active"
    id: target2_active
  - platform: template
    name: "Target 3 Active"
    id: target3_active
  - platform: template
    name: "Target 4 Active"
    id: target4_active
  - platform: template
    name: "Target 5 Active"
    id: target5_active
  - platform: template
    name: "Target 6 Active"
    id: target6_active
  - platform: template
    name: "Target 7 Active"
    id: target7_active
  - platform: template
    name: "Target 8 Active"
    id: target8_active
  - platform: template
    name: "Target 9 Active"
    id: target9_active
  - platform: template
    name: "Target 10 Active"
    id: target10_active

number:
  - platform: template
    name: "Occupancy Off Delay"
    id: off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: True
    restore_value: True
    unit_of_measurement: "s"
    initial_value: 15
  - platform: template
    name: "Installation Angle"
    id: installation_angle_ui
    unit_of_measurement: "º"
    min_value: -45
    max_value: 45
    step: 1
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:angle-acute"
    entity_category: config

  # Zone 1
  - platform: template
    name: "Zone 1 Begin X"
    id: zone1_begin_x
    max_value: 6000
    min_value: -6000
    unit_of_measurement: "mm"
    step: 10
    optimistic: True
    restore_value: True
    initial_value: -4000
  - platform: template
    name: "Zone 1 End X"
    id: zone1_end_x
    max_value: 6000
    min_value: -6000
    unit_of_measurement: "mm"
    step: 10
    optimistic: True
    restore_value: True
    initial_value: 4000
  - platform: template
    name: "Zone 1 Begin Y"
    id: zone1_begin_y
    max_value: 6000
    min_value: -1560 # if epl is rotated 45deg, a target could be detected at negative values: -6000*sin(60deg-45deg) = ~-1552
    unit_of_measurement: "mm"
    step: 10
    optimistic: True
    restore_value: True
    initial_value: 0
  - platform: template
    name: "Zone 1 End Y"
    id: zone1_end_y
    max_value: 6000
    min_value: -1560
    unit_of_measurement: "mm"
    step: 10
    optimistic: True
    restore_value: True
    initial_value: 6000
  - platform: template
    name: "Zone 1 Occupancy Off Delay"
    id: zone_1_off_delay
    max_value: 600
    min_value: 0
    step: 1
    optimistic: True
    restore_value: True
    unit_of_measurement: "s"
    initial_value: 15

  # Zone 2
  - platform: template
